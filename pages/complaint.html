<section id="complaint">
  <!-- file complaint modal -->
  <div id="cmp-modal-overlay" class="hidden">
    <div id="cmp-modal">
      <h3 id="cmp-modal-title">File a Complaint</h3>

      <div class="form-error" id="cmp-form-error"></div>

      <div class="form-row">
        <div>
          <label for="cmp-resident">Your name</label>
          <input
            id="cmp-resident"
            type="text"
            placeholder="Full name"
            maxlength="80"
            autocomplete="name"
          />
        </div>
        <div>
          <label for="cmp-flat">Flat number</label>
          <input id="cmp-flat" type="text" placeholder="A-101" maxlength="20" />
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="cmp-category">Category</label>
          <select id="cmp-category">
            <option value="Plumbing">Plumbing</option>
            <option value="Electrical">Electrical</option>
            <option value="Common Area">Common Area</option>
            <option value="Noise">Noise</option>
            <option value="Sanitation">Sanitation</option>
          </select>
        </div>
        <div>
          <label for="cmp-priority">Priority</label>
          <select id="cmp-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <label for="cmp-title">Title</label>
      <input
        id="cmp-title"
        type="text"
        placeholder="Short description of the issue"
        maxlength="80"
      />

      <label for="cmp-desc">Description</label>
      <textarea
        id="cmp-desc"
        rows="3"
        placeholder="Explain the problem..."
      ></textarea>

      <div class="modal-actions">
        <button class="btn-cancel-modal" id="cmp-modal-close">Cancel</button>
        <button class="btn-submit" id="cmp-form-submit">Submit</button>
      </div>
    </div>
  </div>

  <div class="complaints-header">
    <div>
      <h1>Complaints</h1>
      <p>File a complaint or report issues across the society.</p>
    </div>
    <button id="btn-file-complaint" class="btn-submit">
      + Lodge Complaint
    </button>
  </div>

  <!-- data-loader.js -> renderComplaints() writes here -->
  <div class="complaints-list"></div>
</section>
