<section id="maintenance">
  <!-- pay dues modal -->
  <div id="maint-modal-overlay" class="hidden">
    <div id="maint-modal">
      <h3 id="maint-modal-title">Pay Maintenance</h3>

      <div class="form-error" id="maint-form-error"></div>

      <div class="form-row">
        <div>
          <label for="maint-flat">Flat number</label>
          <input
            id="maint-flat"
            type="text"
            placeholder="A-101"
            maxlength="20"
          />
        </div>
        <div>
          <label for="maint-amount">Amount (₹)</label>
          <input id="maint-amount" type="number" placeholder="2000" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel-modal" id="maint-modal-close">Cancel</button>
        <button class="btn-submit" id="maint-form-submit">Confirm Pay</button>
      </div>
    </div>
  </div>

  <div class="maintenance-header">
    <div>
      <h1>Maintenance Dues</h1>
      <p>Monthly society maintenance and dues records.</p>
    </div>
    <button id="btn-pay-dues" class="btn-submit">Pay Dues</button>
  </div>

  <!-- data-loader.js -> renderMaintenance() writes here -->
  <div class="maintenance-list"></div>
</section>
