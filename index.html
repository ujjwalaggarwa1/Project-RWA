            </button>

            <button id="menu-btn">
              <svg
                id="menu-svg"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="menu-svg"
              >
                <path class="line top" d="M4 5h16" />
                <path class="line middle" d="M4 12h16" />
                <path class="line bottom" d="M4 19h16" />
